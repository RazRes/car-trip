<!doctype html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Echipaj Transalpina</title>
<style>
  :root {
    --bg: #15171c;
    --surface: #1e2128;
    --border: #2c3038;
    --text: #eceef1;
    --text-dim: #9aa1ac;
    --accent: #ef6b6b;
    --green: #4ade9a;
    --green-bg: #17301f;
    --amber: #e5b567;
    --amber-bg: #332510;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 32px 16px; }
  .header-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; flex-wrap: wrap; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--text-dim); font-size: 13px; margin-bottom: 20px; }
  .io-buttons { display: flex; gap: 8px; }
  .io-buttons button {
    background: transparent; color: var(--text-dim); border: 1px solid var(--border);
    padding: 6px 12px; font-size: 12px;
  }
  .status-banner {
    display: none; font-size: 13px; padding: 10px 14px; border-radius: 8px; margin-bottom: 16px;
  }
  .status-banner.show { display: block; }
  .status-banner.error { background: #3a2426; color: #ef6b6b; border: 1px solid #5a2f2f; }
  .status-banner.info { background: var(--surface); color: var(--text-dim); border: 1px solid var(--border); }
  .trip-banner {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    overflow: hidden; margin-bottom: 20px;
  }
  .trip-banner .poster {
    position: relative; height: 280px; overflow: hidden;
  }
  .trip-banner .poster-bg {
    position: absolute; inset: 0; background-image: url(trip-banner.png);
    background-size: cover; background-position: center; filter: blur(18px) brightness(0.55);
    transform: scale(1.15);
  }
  .trip-banner img {
    position: relative; z-index: 1; display: block;
    height: 100%; width: 100%; object-fit: contain;
  }
  .trip-banner .stats-row { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; padding: 14px 16px; }
  .trip-banner .stat { font-size: 13px; }
  .trip-banner .stat .label { color: var(--text-dim); display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 2px; }
  .trip-banner .stat .value { font-weight: 700; font-size: 15px; }
  .summary-row {
    display: flex; gap: 16px; flex-wrap: wrap;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px; margin-bottom: 20px;
  }
  .summary-row .stat { font-size: 13px; }
  .summary-row .stat .label { color: var(--text-dim); display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 2px; }
  .summary-row .stat .value { font-weight: 700; font-size: 20px; color: var(--accent); }
  form {
    display: flex; flex-direction: column; gap: 8px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px; margin-bottom: 24px;
  }
  .checkbox-row {
    display: flex; align-items: center; gap: 8px; font-size: 14px; padding: 4px 2px;
  }
  .checkbox-row input[type="checkbox"] { width: auto; flex-shrink: 0; }
  #roomCountRow { display: none; }
  #roomCountRow.show { display: block; }
  .field-label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 4px; }
  input, select, textarea {
    padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--bg); color: var(--text); font-size: 14px; width: 100%;
    font-family: inherit;
  }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  input[type="file"] { padding: 8px; font-size: 13px; }
  textarea { resize: vertical; }
  .char-count { font-size: 11px; color: var(--text-dim); text-align: right; margin-top: -4px; }
  button {
    padding: 10px 16px; border-radius: 8px; border: none; font-size: 14px; font-weight: 600;
    cursor: pointer; background: var(--accent); color: white;
  }
  button:hover { opacity: 0.9; }
  button:disabled { opacity: 0.5; cursor: default; }
  .item {
    display: flex; align-items: center; gap: 12px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; margin-bottom: 8px;
  }
  .avatar {
    width: 48px; height: 48px; border-radius: 8px; object-fit: cover; flex-shrink: 0;
    background: var(--bg); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center; font-size: 18px; color: var(--text-dim);
  }
  .info { flex: 1; min-width: 0; }
  .info .name { font-weight: 700; font-size: 15px; }
  .info .meta { color: var(--text-dim); font-size: 13px; margin-top: 1px; }
  .info .meta .plate {
    display: inline-block; font-family: monospace; font-weight: 700; letter-spacing: 0.03em;
    background: var(--bg); border: 1px solid var(--border); border-radius: 4px;
    padding: 1px 6px; margin-left: 6px; color: var(--text);
  }
  .info .meta .room {
    display: inline-block; font-weight: 700; letter-spacing: 0.02em;
    background: var(--bg); border: 1px solid var(--border); border-radius: 4px;
    padding: 1px 6px; margin-left: 6px; color: var(--accent);
  }
  .info .notes { color: var(--text-dim); font-size: 12px; margin-top: 4px; font-style: italic; }
  .status-badge {
    display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px;
    text-transform: uppercase; letter-spacing: 0.03em; margin-right: 6px; vertical-align: middle;
  }
  .status-badge.confirmed { background: var(--green-bg); color: var(--green); }
  .status-badge.maybe { background: var(--amber-bg); color: var(--amber); }
  .status-badge.cant_come { background: var(--bg); color: var(--text-dim); }
  .item.cant-come { opacity: 0.55; }
  .item button {
    background: transparent; color: var(--text-dim); border: 1px solid var(--border);
    padding: 6px 10px; font-size: 12px; font-weight: 600; flex-shrink: 0;
  }
  .item .actions { display: flex; gap: 6px; flex-shrink: 0; }
  .item button[data-edit] { color: var(--accent); border-color: var(--accent); }
  #cancelEditBtn {
    display: none; background: transparent; color: var(--text-dim); border: 1px solid var(--border);
  }
  .empty { color: var(--text-dim); font-size: 14px; text-align: center; padding: 24px 0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header-row">
    <div>
      <h1>🚗 Echipaj Transalpina</h1>
      <div class="sub">Cine vine, cu ce mașină. Partajat live cu grupul.</div>
    </div>
    <div class="io-buttons">
      <button type="button" id="refreshBtn">Reîmprospătează</button>
    </div>
  </div>

  <div id="statusBanner" class="status-banner"></div>

  <div class="trip-banner">
    <div class="poster">
      <div class="poster-bg"></div>
      <img src="trip-banner.png" alt="Afiș eveniment Ford RS/ST România — Transalpina">
    </div>
    <div class="stats-row">
      <div class="stat"><span class="label">Perioadă</span><span class="value">19–20 septembrie</span></div>
      <div class="stat"><span class="label">Direcție</span><span class="value">Transalpina</span></div>
    </div>
  </div>

  <div class="summary-row">
    <div class="stat"><span class="label">Mașini confirmate</span><span class="value" id="summaryPeople">0</span></div>
    <div class="stat"><span class="label">Camere necesare</span><span class="value" id="summaryRooms">0</span></div>
  </div>

  <form id="addForm">
    <input id="nameInput" placeholder="Nume">
    <div>
      <label class="field-label">Participare</label>
      <select id="rsvpInput">
        <option value="confirmed">✅ Confirmat</option>
        <option value="maybe">❔ Poate</option>
        <option value="cant_come">❌ Nu pot veni</option>
      </select>
    </div>
    <input id="carInput" placeholder="Mașină (ex. VW Golf GTI)">
    <input id="plateInput" placeholder="Număr de înmatriculare" style="text-transform: uppercase;">
    <input id="photoInput" type="file" accept="image/*">
    <label class="checkbox-row">
      <input type="checkbox" id="roomCheck">
      Vrei cameră de hotel duminică seara?
    </label>
    <div id="roomCountRow">
      <label class="field-label">Total persoane care împart camera (inclusiv tu)</label>
      <input id="roomCountInput" type="number" min="1" value="2">
    </div>
    <textarea id="notesInput" rows="2" maxlength="160" placeholder="Notițe (opțional) — ex. aduc portbagaj, plec la ora 6"></textarea>
    <div class="char-count" id="notesCount">0/160</div>
    <div class="row" style="display:flex; gap:8px;">
      <button type="submit" id="submitBtn" style="flex:1;">Adaugă în echipaj</button>
      <button type="button" id="cancelEditBtn">Anulează</button>
    </div>
  </form>

  <div id="list"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://ltzuujyeyhdohxvqbthz.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_VG6zPybiK1mrU6lWMh9q4w_RHNgfKQk';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let crew = [];
  let editingId = null;

  const listEl = document.getElementById('list');
  const nameInput = document.getElementById('nameInput');
  const carInput = document.getElementById('carInput');
  const plateInput = document.getElementById('plateInput');
  const rsvpInput = document.getElementById('rsvpInput');
  const notesInput = document.getElementById('notesInput');
  const photoInput = document.getElementById('photoInput');
  const roomCheck = document.getElementById('roomCheck');
  const roomCountRow = document.getElementById('roomCountRow');
  const roomCountInput = document.getElementById('roomCountInput');
  const submitBtn = document.getElementById('submitBtn');
  const cancelEditBtn = document.getElementById('cancelEditBtn');
  const statusBanner = document.getElementById('statusBanner');
  const notesCount = document.getElementById('notesCount');
  const NOTES_MAX = 160;

  roomCheck.addEventListener('change', () => {
    roomCountRow.classList.toggle('show', roomCheck.checked);
  });

  plateInput.addEventListener('input', () => {
    const pos = plateInput.selectionStart;
    plateInput.value = plateInput.value.toUpperCase();
    plateInput.setSelectionRange(pos, pos);
  });

  notesInput.addEventListener('input', () => {
    notesCount.textContent = `${notesInput.value.length}/${NOTES_MAX}`;
  });

  const OWNER_KEY = 'trip-crew-owner-tokens';

  function getOwnerTokens() {
    try { return JSON.parse(localStorage.getItem(OWNER_KEY) || '{}'); } catch (e) { return {}; }
  }

  function rememberOwner(id, token) {
    const tokens = getOwnerTokens();
    tokens[id] = token;
    localStorage.setItem(OWNER_KEY, JSON.stringify(tokens));
  }

  function canManage(person) {
    if (!person.owner_token) return true;
    return getOwnerTokens()[person.id] === person.owner_token;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str == null ? '' : str;
    return div.innerHTML;
  }

  function showStatus(message, type) {
    statusBanner.textContent = message;
    statusBanner.className = 'status-banner show ' + type;
  }

  function hideStatus() {
    statusBanner.className = 'status-banner';
  }

  function resizeImage(file, maxDim, quality) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          let { width, height } = img;
          if (width > height && width > maxDim) { height = Math.round(height * maxDim / width); width = maxDim; }
          else if (height > maxDim) { width = Math.round(width * maxDim / height); height = maxDim; }
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.onerror = reject;
        img.src = reader.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  async function fetchCrew() {
    const { data, error } = await sb.from('crew_members').select('*').order('created_at', { ascending: false });
    if (error) {
      showStatus('Nu am putut încărca lista — ' + error.message, 'error');
      return;
    }
    hideStatus();
    crew = data;
    render();
  }

  const STATUS_LABELS = { confirmed: '✅ Confirmat', maybe: '❔ Poate', cant_come: "❌ Nu vine" };

  function render() {
    const drivers = crew.filter(p => (p.rsvp_status || 'confirmed') === 'confirmed' && !p.riding_with);
    const rooms = crew.filter(p => (p.rsvp_status || 'confirmed') === 'confirmed' && p.room_people);
    document.getElementById('summaryPeople').textContent = drivers.length;
    document.getElementById('summaryRooms').textContent = rooms.length;

    if (crew.length === 0) {
      listEl.innerHTML = '<div class="empty">Nimeni adăugat încă.</div>';
      return;
    }
    listEl.innerHTML = crew.map(person => {
      const status = person.rsvp_status || 'confirmed';
      return `
      <div class="item ${status === 'cant_come' ? 'cant-come' : ''}">
        ${person.photo
          ? `<img class="avatar" src="${person.photo}" alt="">`
          : `<div class="avatar">🙂</div>`}
        <div class="info">
          <div class="name"><span class="status-badge ${status}">${STATUS_LABELS[status]}</span>${escapeHtml(person.name)}</div>
          <div class="meta">${person.riding_with ? `🚗 Merge cu ${escapeHtml(person.riding_with)}` : (escapeHtml(person.car) || 'Fără mașină')}${person.plate ? `<span class="plate">${escapeHtml(person.plate)}</span>` : ''}${person.room_people ? `<span class="room">🏨 Cameră pentru ${person.room_people}</span>` : ''}</div>
          ${person.notes ? `<div class="notes">${escapeHtml(person.notes)}</div>` : ''}
        </div>
        <div class="actions">
          ${canManage(person) ? `
            <button data-edit="${person.id}">Editează</button>
            <button data-remove="${person.id}">Șterge</button>
          ` : ''}
        </div>
      </div>
    `;
    }).join('');
    listEl.querySelectorAll('button[data-remove]').forEach(btn => {
      btn.addEventListener('click', () => removePerson(btn.dataset.remove));
    });
    listEl.querySelectorAll('button[data-edit]').forEach(btn => {
      btn.addEventListener('click', () => startEdit(btn.dataset.edit));
    });
  }

  async function removePerson(id) {
    const person = crew.find(p => p.id === id);
    if (!confirm(`Ștergi pe ${person ? person.name : 'această persoană'} din echipaj?`)) return;
    const { error } = await sb.from('crew_members').delete().eq('id', id);
    if (error) { showStatus('Nu am putut șterge — ' + error.message, 'error'); return; }
    if (editingId === id) { editingId = null; resetForm(); }
    await fetchCrew();
  }

  document.getElementById('addForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = nameInput.value.trim();
    if (!name) return;

    submitBtn.disabled = true;

    const fields = {
      name,
      car: carInput.value.trim(),
      plate: plateInput.value.trim().toUpperCase(),
      rsvp_status: rsvpInput.value,
      notes: notesInput.value.trim() || null,
      room_people: roomCheck.checked ? (Number(roomCountInput.value) || 1) : null
    };

    const file = photoInput.files[0];
    if (file) {
      try {
        fields.photo = await resizeImage(file, 500, 0.75);
      } catch (err) {
        showStatus('Nu am putut citi poza, o salvez fără ea.', 'error');
      }
    }

    await commit(fields);
    submitBtn.disabled = false;
  });

  async function commit(fields) {
    if (editingId !== null) {
      const update = { ...fields };
      if (update.photo === undefined) delete update.photo;
      const { error } = await sb.from('crew_members').update(update).eq('id', editingId);
      if (error) { showStatus('Nu am putut salva modificările — ' + error.message, 'error'); return; }
      editingId = null;
    } else {
      const ownerToken = crypto.randomUUID();
      const { data, error } = await sb.from('crew_members')
        .insert([{ ...fields, photo: fields.photo || null, owner_token: ownerToken }])
        .select();
      if (error) { showStatus('Nu am putut adăuga — ' + error.message, 'error'); return; }
      if (data && data[0]) rememberOwner(data[0].id, ownerToken);
    }
    hideStatus();
    resetForm();
    await fetchCrew();
  }

  function startEdit(id) {
    const person = crew.find(p => p.id === id);
    if (!person) return;
    editingId = id;
    nameInput.value = person.name;
    carInput.value = person.car || '';
    plateInput.value = person.plate || '';
    rsvpInput.value = person.rsvp_status || 'confirmed';
    notesInput.value = person.notes || '';
    notesCount.textContent = `${notesInput.value.length}/${NOTES_MAX}`;
    photoInput.value = '';
    roomCheck.checked = !!person.room_people;
    roomCountRow.classList.toggle('show', roomCheck.checked);
    roomCountInput.value = person.room_people || 2;
    submitBtn.textContent = 'Salvează modificările';
    cancelEditBtn.style.display = 'inline-block';
    nameInput.focus();
    nameInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  cancelEditBtn.addEventListener('click', () => {
    editingId = null;
    resetForm();
  });

  function resetForm() {
    nameInput.value = '';
    carInput.value = '';
    plateInput.value = '';
    rsvpInput.value = 'confirmed';
    notesInput.value = '';
    notesCount.textContent = `0/${NOTES_MAX}`;
    photoInput.value = '';
    roomCheck.checked = false;
    roomCountRow.classList.remove('show');
    roomCountInput.value = 2;
    submitBtn.textContent = 'Adaugă în echipaj';
    cancelEditBtn.style.display = 'none';
  }

  document.getElementById('refreshBtn').addEventListener('click', fetchCrew);

  sb.channel('crew_members_changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'crew_members' }, () => {
      fetchCrew();
    })
    .subscribe();

  fetchCrew();
</script>
</body>
</html>
