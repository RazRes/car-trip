<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trip Crew</title>
<style>
  :root {
    --bg: #15171c;
    --surface: #1e2128;
    --border: #2c3038;
    --text: #eceef1;
    --text-dim: #9aa1ac;
    --accent: #ef6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 32px 16px; }
  .header-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; flex-wrap: wrap; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--text-dim); font-size: 13px; margin-bottom: 20px; }
  .io-buttons { display: flex; gap: 8px; }
  .io-buttons button {
    background: transparent; color: var(--text-dim); border: 1px solid var(--border);
    padding: 6px 12px; font-size: 12px;
  }
  .status-banner {
    display: none; font-size: 13px; padding: 10px 14px; border-radius: 8px; margin-bottom: 16px;
  }
  .status-banner.show { display: block; }
  .status-banner.error { background: #3a2426; color: #ef6b6b; border: 1px solid #5a2f2f; }
  .status-banner.info { background: var(--surface); color: var(--text-dim); border: 1px solid var(--border); }
  .trip-banner {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    overflow: hidden; margin-bottom: 20px;
  }
  .trip-banner .poster {
    position: relative; height: 280px; overflow: hidden;
  }
  .trip-banner .poster-bg {
    position: absolute; inset: 0; background-image: url(trip-banner.png);
    background-size: cover; background-position: center; filter: blur(18px) brightness(0.55);
    transform: scale(1.15);
  }
  .trip-banner img {
    position: relative; z-index: 1; display: block;
    height: 100%; width: 100%; object-fit: contain;
  }
  .trip-banner .stats-row { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; padding: 14px 16px; }
  .trip-banner .stat { font-size: 13px; }
  .trip-banner .stat .label { color: var(--text-dim); display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 2px; }
  .trip-banner .stat .value { font-weight: 700; font-size: 15px; }
  .summary-row {
    display: flex; gap: 16px; flex-wrap: wrap;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px; margin-bottom: 20px;
  }
  .summary-row .stat { font-size: 13px; }
  .summary-row .stat .label { color: var(--text-dim); display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 2px; }
  .summary-row .stat .value { font-weight: 700; font-size: 20px; color: var(--accent); }
  form {
    display: flex; flex-direction: column; gap: 8px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px; margin-bottom: 24px;
  }
  .checkbox-row {
    display: flex; align-items: center; gap: 8px; font-size: 14px; padding: 4px 2px;
  }
  .checkbox-row input[type="checkbox"] { width: auto; flex-shrink: 0; }
  #roomCountRow { display: none; }
  #roomCountRow.show { display: block; }
  .room-count-label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 4px; }
  input {
    padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--bg); color: var(--text); font-size: 14px; width: 100%;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  input[type="file"] { padding: 8px; font-size: 13px; }
  button {
    padding: 10px 16px; border-radius: 8px; border: none; font-size: 14px; font-weight: 600;
    cursor: pointer; background: var(--accent); color: white;
  }
  button:hover { opacity: 0.9; }
  button:disabled { opacity: 0.5; cursor: default; }
  .item {
    display: flex; align-items: center; gap: 12px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; margin-bottom: 8px;
  }
  .avatar {
    width: 48px; height: 48px; border-radius: 8px; object-fit: cover; flex-shrink: 0;
    background: var(--bg); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center; font-size: 18px; color: var(--text-dim);
  }
  .info { flex: 1; min-width: 0; }
  .info .name { font-weight: 700; font-size: 15px; }
  .info .meta { color: var(--text-dim); font-size: 13px; margin-top: 1px; }
  .info .meta .plate {
    display: inline-block; font-family: monospace; font-weight: 700; letter-spacing: 0.03em;
    background: var(--bg); border: 1px solid var(--border); border-radius: 4px;
    padding: 1px 6px; margin-left: 6px; color: var(--text);
  }
  .info .meta .room {
    display: inline-block; font-weight: 700; letter-spacing: 0.02em;
    background: var(--bg); border: 1px solid var(--border); border-radius: 4px;
    padding: 1px 6px; margin-left: 6px; color: var(--accent);
  }
  .item button {
    background: transparent; color: var(--text-dim); border: 1px solid var(--border);
    padding: 6px 10px; font-size: 12px; font-weight: 600; flex-shrink: 0;
  }
  .item .actions { display: flex; gap: 6px; flex-shrink: 0; }
  .item button[data-edit] { color: var(--accent); border-color: var(--accent); }
  #cancelEditBtn {
    display: none; background: transparent; color: var(--text-dim); border: 1px solid var(--border);
  }
  .empty { color: var(--text-dim); font-size: 14px; text-align: center; padding: 24px 0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header-row">
    <div>
      <h1>🚗 Trip Crew</h1>
      <div class="sub">Who's coming, what they're driving. Shared live with the group.</div>
    </div>
    <div class="io-buttons">
      <button type="button" id="refreshBtn">Refresh</button>
    </div>
  </div>

  <div id="statusBanner" class="status-banner"></div>

  <div class="trip-banner">
    <div class="poster">
      <div class="poster-bg"></div>
      <img src="trip-banner.png" alt="Ford RS/ST Romania — Transalpina event poster">
    </div>
    <div class="stats-row">
      <div class="stat"><span class="label">Dates</span><span class="value">19–20 September</span></div>
      <div class="stat"><span class="label">Direction</span><span class="value">Transalpina</span></div>
    </div>
  </div>

  <div class="summary-row">
    <div class="stat"><span class="label">Cars coming</span><span class="value" id="summaryPeople">0</span></div>
    <div class="stat"><span class="label">Rooms needed</span><span class="value" id="summaryRooms">0</span></div>
  </div>

  <form id="addForm">
    <input id="nameInput" placeholder="Name">
    <input id="carInput" placeholder="Car (e.g. VW Golf GTI)">
    <input id="plateInput" placeholder="Number plate">
    <input id="photoInput" type="file" accept="image/*">
    <label class="checkbox-row">
      <input type="checkbox" id="roomCheck">
      Want a hotel room Sunday night?
    </label>
    <div id="roomCountRow">
      <label class="room-count-label">Total people sharing that one room (including you)</label>
      <input id="roomCountInput" type="number" min="1" value="2">
    </div>
    <div class="row" style="display:flex; gap:8px;">
      <button type="submit" id="submitBtn" style="flex:1;">Add to crew</button>
      <button type="button" id="cancelEditBtn">Cancel</button>
    </div>
  </form>

  <div id="list"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://ltzuujyeyhdohxvqbthz.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_VG6zPybiK1mrU6lWMh9q4w_RHNgfKQk';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let crew = [];
  let editingId = null;

  const listEl = document.getElementById('list');
  const nameInput = document.getElementById('nameInput');
  const carInput = document.getElementById('carInput');
  const plateInput = document.getElementById('plateInput');
  const photoInput = document.getElementById('photoInput');
  const roomCheck = document.getElementById('roomCheck');
  const roomCountRow = document.getElementById('roomCountRow');
  const roomCountInput = document.getElementById('roomCountInput');
  const submitBtn = document.getElementById('submitBtn');
  const cancelEditBtn = document.getElementById('cancelEditBtn');
  const statusBanner = document.getElementById('statusBanner');

  roomCheck.addEventListener('change', () => {
    roomCountRow.classList.toggle('show', roomCheck.checked);
  });

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str == null ? '' : str;
    return div.innerHTML;
  }

  function showStatus(message, type) {
    statusBanner.textContent = message;
    statusBanner.className = 'status-banner show ' + type;
  }

  function hideStatus() {
    statusBanner.className = 'status-banner';
  }

  function resizeImage(file, maxDim, quality) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          let { width, height } = img;
          if (width > height && width > maxDim) { height = Math.round(height * maxDim / width); width = maxDim; }
          else if (height > maxDim) { width = Math.round(width * maxDim / height); height = maxDim; }
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.onerror = reject;
        img.src = reader.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  async function fetchCrew() {
    const { data, error } = await sb.from('crew_members').select('*').order('created_at', { ascending: false });
    if (error) {
      showStatus('Could not load the crew list — ' + error.message, 'error');
      return;
    }
    hideStatus();
    crew = data;
    render();
  }

  function render() {
    document.getElementById('summaryPeople').textContent = crew.length;
    document.getElementById('summaryRooms').textContent = crew.filter(p => p.room_people).length;

    if (crew.length === 0) {
      listEl.innerHTML = '<div class="empty">No one added yet.</div>';
      return;
    }
    listEl.innerHTML = crew.map(person => `
      <div class="item">
        ${person.photo
          ? `<img class="avatar" src="${person.photo}" alt="">`
          : `<div class="avatar">🙂</div>`}
        <div class="info">
          <div class="name">${escapeHtml(person.name)}</div>
          <div class="meta">${escapeHtml(person.car) || 'No car set'}${person.plate ? `<span class="plate">${escapeHtml(person.plate)}</span>` : ''}${person.room_people ? `<span class="room">🏨 Room for ${person.room_people}</span>` : ''}</div>
        </div>
        <div class="actions">
          <button data-edit="${person.id}">Edit</button>
          <button data-remove="${person.id}">Remove</button>
        </div>
      </div>
    `).join('');
    listEl.querySelectorAll('button[data-remove]').forEach(btn => {
      btn.addEventListener('click', () => removePerson(btn.dataset.remove));
    });
    listEl.querySelectorAll('button[data-edit]').forEach(btn => {
      btn.addEventListener('click', () => startEdit(btn.dataset.edit));
    });
  }

  async function removePerson(id) {
    const { error } = await sb.from('crew_members').delete().eq('id', id);
    if (error) { showStatus('Could not remove — ' + error.message, 'error'); return; }
    if (editingId === id) { editingId = null; resetForm(); }
    await fetchCrew();
  }

  document.getElementById('addForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = nameInput.value.trim();
    if (!name) return;

    submitBtn.disabled = true;

    const fields = {
      name,
      car: carInput.value.trim(),
      plate: plateInput.value.trim(),
      room_people: roomCheck.checked ? (Number(roomCountInput.value) || 1) : null
    };

    const file = photoInput.files[0];
    if (file) {
      try {
        fields.photo = await resizeImage(file, 500, 0.75);
      } catch (err) {
        showStatus('Could not read that photo, saving without it.', 'error');
      }
    }

    await commit(fields);
    submitBtn.disabled = false;
  });

  async function commit(fields) {
    if (editingId !== null) {
      const update = { ...fields };
      if (update.photo === undefined) delete update.photo;
      const { error } = await sb.from('crew_members').update(update).eq('id', editingId);
      if (error) { showStatus('Could not save changes — ' + error.message, 'error'); return; }
      editingId = null;
    } else {
      const { error } = await sb.from('crew_members').insert([{ ...fields, photo: fields.photo || null }]);
      if (error) { showStatus('Could not add — ' + error.message, 'error'); return; }
    }
    hideStatus();
    resetForm();
    await fetchCrew();
  }

  function startEdit(id) {
    const person = crew.find(p => p.id === id);
    if (!person) return;
    editingId = id;
    nameInput.value = person.name;
    carInput.value = person.car || '';
    plateInput.value = person.plate || '';
    photoInput.value = '';
    roomCheck.checked = !!person.room_people;
    roomCountRow.classList.toggle('show', roomCheck.checked);
    roomCountInput.value = person.room_people || 2;
    submitBtn.textContent = 'Save changes';
    cancelEditBtn.style.display = 'inline-block';
    nameInput.focus();
    nameInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  cancelEditBtn.addEventListener('click', () => {
    editingId = null;
    resetForm();
  });

  function resetForm() {
    nameInput.value = '';
    carInput.value = '';
    plateInput.value = '';
    photoInput.value = '';
    roomCheck.checked = false;
    roomCountRow.classList.remove('show');
    roomCountInput.value = 2;
    submitBtn.textContent = 'Add to crew';
    cancelEditBtn.style.display = 'none';
  }

  document.getElementById('refreshBtn').addEventListener('click', fetchCrew);

  sb.channel('crew_members_changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'crew_members' }, () => {
      fetchCrew();
    })
    .subscribe();

  fetchCrew();
</script>
</body>
</html>
